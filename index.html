<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ROOMZY | Find Your Perfect PG</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<!-- ================= HEADER ================= -->

<header class="top-header">

    <a href="#" class="roomzy-logo" onclick="goHome()">
        <img src="logo.png" alt="ROOMZY Logo" class="logo-img">
        <span class="logo-text">ROOM<span class="brand-highlight">ZY</span></span>
    </a>

    <div class="header-right">
        <nav class="header-nav">
            <a href="#" onclick="scrollToPG()">Explore PGs</a>
            <a href="#" onclick="scrollToWhyChoose()">Why RoomZy</a>
            <a href="#" onclick="openAboutModal()">About Us</a>
        </nav>

        <button class="student-login-btn" onclick="openLogin()">
            Sign in
        </button>

        <button class="menu-btn" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>

    <div class="menu-dropdown" id="menuDropdown">
        <a href="#" onclick="goHome()">Home</a>
        <a href="#" onclick="scrollToPG()">Explore PGs</a>
        <a href="#" onclick="scrollToWhyChoose()">Why RoomZy</a>
        <a href="#" onclick="openAboutModal()">About Us</a>
        <a href="#" onclick="openLogin()">Sign in</a>
    </div>

</header>


<!-- ================= HOME PAGE ================= -->

<main id="homePage">

    <!-- HERO -->

    <section class="hero">
        <div class="hero-container">
            <div class="hero-left">
                <div class="hero-badge">
                    <i class="fa-solid fa-circle-check"></i> Verified Student PGs & Co-living
                </div>
                <h1>Explore Verified <br><span class="hero-highlight">Rooms And PGs</span></h1>
                <p class="hero-desc">The simplest way to find your perfect stay, verified and ready to move in.</p>
                <div class="hero-buttons">
                    <button class="hero-primary-btn" onclick="scrollToPG()">Explore stays <i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </div>
            <div class="hero-right">
                <div class="hero-images">
                    <div class="featured-card card-small">
                        <img src="https://images.unsplash.com/photo-1595526114035-0d45ed16cfbf?w=800" alt="Student Life" onerror="this.style.display='none'">
                    </div>
                    <div class="featured-card card-small">
                        <img src="https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?w=800" alt="Co-living Space" onerror="this.style.display='none'">
                    </div>
                </div>
            </div>
        </div>




    



    

</main>



<!-- ================= PG DETAIL PAGE ================= -->

<section id="pgDetailPage" class="pg-detail-page" hidden>
    <div class="pg-detail-container">
        <button class="detail-back-btn" onclick="closePgDetail()">
            <i class="fa-solid fa-arrow-left"></i> Back to Listings
        </button>
        <div id="pgDetailContent"></div>
    </div>
</section>


<script src="script.js"></script>

<!-- Auto-update copyright year -->
<script>
    document.getElementById('currentYear').textContent = new Date().getFullYear();
</script>

</body>
</html>
