<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roomzy Jaipur — Real PG Listings & Owner Auth</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23E53935' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 10.5 12 3l9 7.5'/><path d='M5 9.8V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.8'/><path d='M9.5 21v-6h5v6'/></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<!-- SUPABASE CLIENT SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { coral: { DEFAULT: '#E53935', dark:'#C62828', 50:'#FFF1F1' }, ink: '#111827', mist: '#F9FAFB', line: '#E5E7EB' } } }
  }
</script>
</head>
<body class="bg-mist text-ink">

<script>
  // YOUR LIVE SUPABASE BACKEND CREDENTIALS
  const SUPABASE_URL = 'https://aglqsqqrjshzckqsadud.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_CKE3m9UtMNnWEI8jboc0HA_Gly1CMjL';
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>

<!-- HEADER -->
<header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-line">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
    <a href="#" onclick="showSection('tenant')" class="font-extrabold text-2xl tracking-tight">Room<span class="text-coral">zy</span> <span class="text-xs px-2 py-0.5 rounded-full bg-coral-50 text-coral font-bold ml-1">Jaipur</span></a>
    <button onclick="showSection('owner')" class="px-4 py-2 rounded-xl bg-coral text-white font-bold text-sm shadow-md">List Property (Owner)</button>
  </div>
</header>

<!-- TENANT VIEW: LIVE FEED FROM DATABASE -->
<main id="tenantSection" class="max-w-6xl mx-auto px-4 py-8">
  <h1 class="text-3xl font-extrabold mb-2">Verified PGs in Jaipur</h1>
  <p class="text-sm text-gray-500 mb-6">Real-time listings submitted directly by owners to Supabase.</p>
  <div id="propertyFeed" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
    <p class="text-sm text-gray-400">Loading live properties from database...</p>
  </div>
</main>

<!-- OWNER VIEW: OTP & LISTING FORM -->
<main id="ownerSection" class="hidden max-w-xl mx-auto px-4 py-12">
  <!-- OTP STEP 1 & 2 -->
  <div id="authBox" class="bg-white p-8 rounded-3xl border border-line shadow-lg text-center">
    <h2 class="text-2xl font-extrabold mb-1">Owner Portal Login</h2>
    <p class="text-xs text-gray-500 mb-6">Enter your mobile number to receive an SMS OTP.</p>

    <!-- PHONE FORM -->
    <div id="phoneForm" class="space-y-4">
      <input type="tel" id="mobileNum" placeholder="+91 9876543210" class="w-full h-12 px-4 rounded-xl border border-line text-center text-sm font-bold outline-none focus:border-coral">
      <button onclick="requestRealOTP()" class="w-full h-12 rounded-xl bg-coral text-white font-extrabold text-sm shadow-md">Send OTP SMS</button>
    </div>

    <!-- OTP FORM -->
    <div id="otpForm" class="hidden space-y-4">
      <input type="text" id="otpCode" placeholder="Enter Received OTP" class="w-full h-12 px-4 rounded-xl border border-line text-center text-sm font-bold tracking-widest outline-none focus:border-coral">
      <button onclick="verifyRealOTP()" class="w-full h-12 rounded-xl bg-coral text-white font-extrabold text-sm shadow-md">Verify OTP & Login</button>
    </div>
  </div>

  <!-- REAL PROPERTY SUBMISSION FORM -->
  <div id="listingBox" class="hidden bg-white p-8 rounded-3xl border border-line shadow-lg">
    <h2 class="text-2xl font-extrabold mb-1">Add Your PG Details</h2>
    <p class="text-xs text-gray-500 mb-6">This listing will save directly to your live PostgreSQL database.</p>
    
    <form onsubmit="submitRealPG(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">PG NAME *</label>
        <input type="text" id="pName" required placeholder="e.g. Sunshine Boys PG" class="w-full h-11 px-4 rounded-xl border border-line text-sm font-semibold outline-none focus:border-coral">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">LOCALITY *</label>
          <input type="text" id="pArea" required placeholder="e.g. Sitapura" class="w-full h-11 px-4 rounded-xl border border-line text-sm font-semibold outline-none focus:border-coral">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">RENT (₹/MO) *</label>
          <input type="number" id="pPrice" required placeholder="7500" class="w-full h-11 px-4 rounded-xl border border-line text-sm font-semibold outline-none focus:border-coral">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">GENDER *</label>
          <select id="pGender" class="w-full h-11 px-4 rounded-xl border border-line text-sm font-semibold outline-none focus:border-coral">
            <option value="Unisex">Unisex</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">CONTACT PHONE *</label>
          <input type="tel" id="pPhone" required placeholder="9876543210" class="w-full h-11 px-4 rounded-xl border border-line text-sm font-semibold outline-none focus:border-coral">
        </div>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">NEARBY LANDMARKS</label>
        <input type="text" id="pLandmarks" placeholder="e.g. Near JECRC College" class="w-full h-11 px-4 rounded-xl border border-line text-sm font-semibold outline-none focus:border-coral">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">IMAGE URL *</label>
        <input type="url" id="pImg" required value="https://images.unsplash.com/photo-1555854877-bab0e564b8d5?w=800" class="w-full h-11 px-4 rounded-xl border border-line text-sm font-semibold outline-none focus:border-coral">
      </div>
      <button type="submit" class="w-full h-12 rounded-xl bg-coral text-white font-extrabold text-sm shadow-md mt-4">Publish PG to Live Database</button>
    </form>
  </div>
</main>

<script>
  function showSection(type) {
    if(type === 'owner'){
      document.getElementById('tenantSection').classList.add('hidden');
      document.getElementById('ownerSection').classList.remove('hidden');
    } else {
      document.getElementById('ownerSection').classList.add('hidden');
      document.getElementById('tenantSection').classList.remove('hidden');
      fetchPropertiesFromDatabase();
    }
  }

  // 1. REQUEST REAL SMS OTP VIA SUPABASE
  async function requestRealOTP() {
    const phone = document.getElementById('mobileNum').value.trim();
    if (!phone) { alert("Please enter a mobile number"); return; }
    
    const { data, error } = await supabase.auth.signInWithOtp({ phone: phone });
    
    if (error) {
      alert("Error sending OTP: " + error.message);
    } else {
      alert("OTP SMS sent to " + phone);
      document.getElementById('phoneForm').classList.add('hidden');
      document.getElementById('otpForm').classList.remove('hidden');
    }
  }

  // 2. VERIFY OTP VIA SUPABASE
  async function verifyRealOTP() {
    const phone = document.getElementById('mobileNum').value.trim();
    const token = document.getElementById('otpCode').value.trim();

    const { data, error } = await supabase.auth.verifyOtp({ phone, token, type: 'sms' });

    if (error) {
      alert("Invalid OTP: " + error.message);
    } else {
      alert("Owner Verified Successfully!");
      document.getElementById('authBox').classList.add('hidden');
      document.getElementById('listingBox').classList.remove('hidden');
    }
  }

  // 3. WRITE NEW PG DIRECTLY TO SUPABASE POSTGRES
  async function submitRealPG(e) {
    e.preventDefault();
    const newProperty = {
      name: document.getElementById('pName').value,
      area: document.getElementById('pArea').value,
      price: parseInt(document.getElementById('pPrice').value),
      gender: document.getElementById('pGender').value,
      phone: document.getElementById('pPhone').value,
      landmarks: document.getElementById('pLandmarks').value,
      img: document.getElementById('pImg').value
    };

    const { data, error } = await supabase.from('properties').insert([newProperty]);

    if (error) {
      alert("Database write error: " + error.message);
    } else {
      alert("🎉 Success! Your PG is now saved live in the database.");
      showSection('tenant');
    }
  }

  // 4. FETCH LIVE PROPERTIES FROM SUPABASE
  async function fetchPropertiesFromDatabase() {
    const feed = document.getElementById('propertyFeed');
    const { data: properties, error } = await supabase.from('properties').select('*').order('id', { ascending: false });

    if (error) {
      feed.innerHTML = `<p class="text-sm text-red-500">Error fetching properties: ${error.message}</p>`;
      return;
    }

    if (!properties || properties.length === 0) {
      feed.innerHTML = `<p class="text-sm text-gray-500">No properties in database yet. Click 'List Property (Owner)' above to add the first real PG!</p>`;
      return;
    }

    feed.innerHTML = properties.map(p => `
      <div class="bg-white rounded-2xl border border-line overflow-hidden shadow-sm hover:shadow-md transition">
        <img src="${p.img}" class="w-full h-48 object-cover">
        <div class="p-4">
          <div class="flex items-center justify-between">
            <h3 class="font-extrabold text-lg truncate">${p.name}</h3>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-coral-50 text-coral">${p.gender}</span>
          </div>
          <p class="text-xs text-gray-500 mt-1">📍 ${p.area}, Jaipur</p>
          ${p.landmarks ? `<p class="text-xs text-gray-400 mt-1">🏫 ${p.landmarks}</p>` : ''}
          <div class="mt-4 flex items-center justify-between border-t border-line pt-3">
            <span class="font-extrabold text-coral text-lg">₹${p.price.toLocaleString('en-IN')}/mo</span>
            <a href="tel:${p.phone}" class="text-xs font-bold text-gray-700 bg-mist px-3 py-1.5 rounded-lg border border-line hover:border-coral">📞 ${p.phone}</a>
          </div>
        </div>
      </div>
    `).join('');
  }

  // Load properties on initial page view
  fetchPropertiesFromDatabase();
</script>
</body>
</html>
