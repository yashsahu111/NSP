<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomZy Jaipur - Find Your Stay</title>
    <!-- Google Fonts for exact typography match -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #f8fafc;
            color: #0f172a;
            padding-bottom: 70px;
        }

        /* Exact Header Match */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 3%;
            background: white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 23px;
            font-weight: 800;
            color: #581c87;
            letter-spacing: 0.2px;
        }

        /* Top Search Bar matching image */
        .top-search {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 8px 14px;
            width: 440px;
            gap: 10px;
        }

        .top-search svg {
            stroke: #334155;
            flex-shrink: 0;
        }

        .top-search input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-size: 14px;
            color: #475569;
            font-weight: 400;
        }

        .top-search input::placeholder {
            color: #94a3b8;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .city-selector {
            font-size: 14.5px;
            font-weight: 400;
            color: #1e293b;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .city-selector svg {
            width: 12px;
            height: 12px;
            stroke: #475569;
            stroke-width: 2.5;
            fill: none;
        }

        .sign-in-btn {
            background: #fb3f5c;
            color: white;
            border: none;
            padding: 8px 22px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .menu-icon {
            font-size: 22px;
            cursor: pointer;
            color: #1e293b;
            font-weight: bold;
        }

        /* Hero Section */
        .hero {
            position: relative;
            min-height: 310px;
            background: linear-gradient(90deg, rgba(15,23,42,0.85) 30%, rgba(15,23,42,0.3) 100%),
                        url("https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=1600") center/cover;
            display: flex;
            align-items: center;
            padding: 25px 5%;
            color: white;
        }

        .hero-content {
            max-width: 600px;
        }

        .hero h1 {
            font-size: 38px;
            line-height: 1.15;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .hero h1 span {
            color: #fb3f5c;
        }

        .hero-tags {
            font-size: 12.5px;
            color: #cbd5e1;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .explore-btn {
            background: #fb3f5c;
            color: white;
            border: none;
            padding: 9px 20px;
            border-radius: 9px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }

        /* Floating Search Filter Bar */
        .filter-bar-wrapper {
            max-width: 1200px;
            margin: -32px auto 0 auto;
            padding: 0 5%;
            position: relative;
            z-index: 30;
        }

        .filter-bar {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            padding: 14px 24px;
            display: grid;
            grid-template-columns: 1fr 1.2fr 1.2fr auto;
            gap: 20px;
            align-items: center;
            border: 1px solid #e2e8f0;
        }

        .filter-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-right: 20px;
            border-right: 1px solid #e2e8f0;
        }

        .filter-item:last-of-type {
            border-right: none;
            padding-right: 0;
        }

        .filter-icon-box {
            font-size: 18px;
            color: #0f172a;
            display: flex;
            align-items: center;
        }

        .filter-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
        }

        .filter-main-val {
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
            border: none;
            outline: none;
            background: transparent;
            cursor: pointer;
            width: 100%;
        }

        .filter-sub-val {
            font-size: 12px;
            color: #64748b;
            font-weight: 500;
        }

        .search-action-btn {
            background: #fb3f5c;
            color: white;
            border: none;
            padding: 13px 40px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14.5px;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-action-btn:hover {
            background: #e11d48;
        }

        /* Category Tabs (Exact Match to screenshot[cite: 13]) */
        .categories-container {
            max-width: 1200px;
            margin: 25px auto 0 auto;
            padding: 0 5%;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 14px;
        }

        .category-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 16px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .category-card.active {
            border-color: #fb3f5c;
            background: #fff5f5;
        }

        .category-card:hover {
            border-color: #fb3f5c;
        }

        .category-icon-svg {
            width: 26px;
            height: 26px;
        }

        .category-title {
            font-size: 13px;
            font-weight: 700;
            color: #0f172a;
        }

        /* Properties Section */
        .properties-section {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 5%;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .section-header h2 {
            font-size: 20px;
            font-weight: 800;
            color: #0f172a;
        }

        .view-all {
            color: #fb3f5c;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        .property-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .property-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            transition: 0.3s;
        }

        .property-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        .card-img-wrapper {
            position: relative;
            height: 150px;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rating-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(15,23,42,0.85);
            color: white;
            padding: 3px 6px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 700;
        }

        .property-info {
            padding: 12px;
        }

        .property-info h3 {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #0f172a;
        }

        .property-info p {
            font-size: 11.5px;
            color: #64748b;
            margin-bottom: 10px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 8px;
        }

        .price {
            font-size: 15px;
            font-weight: 800;
            color: #0f172a;
        }

        .price span {
            font-size: 10.5px;
            color: #64748b;
            font-weight: normal;
        }

        .details-btn {
            background: #fb3f5c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Fixed Mobile Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 60;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
            gap: 2px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #fb3f5c;
        }

        .nav-item svg {
            width: 19px;
            height: 19px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            inset: 0;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 22px;
            border-radius: 14px;
            position: relative;
        }

        .close {
            position: absolute;
            right: 16px;
            top: 10px;
            font-size: 20px;
            cursor: pointer;
            color: #64748b;
        }

        .modal-content h2 {
            margin-bottom: 10px;
            font-size: 17px;
            font-weight: 800;
        }

        .modal-content input,
        .modal-content select {
            width: 100%;
            padding: 9px 12px;
            margin: 5px 0 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 12.5px;
        }

        .modal-content button[type="submit"],
        .modal-content button.action-sub {
            width: 100%;
            background: #fb3f5c;
            color: white;
            padding: 9px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
        }

        /* Responsive Design */
        @media(max-width: 1024px) {
            .categories-container {
                grid-template-columns: repeat(4, 1fr);
            }
            .property-container {
                grid-template-columns: repeat(2, 1fr);
            }
            .filter-bar {
                grid-template-columns: 1fr;
            }
            .top-search {
                display: none;
            }
        }

        @media(max-width: 600px) {
            .categories-container {
                grid-template-columns: repeat(2, 1fr);
            }
            .property-container {
                grid-template-columns: 1fr;
            }
            .hero h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

<!-- Header -->
<header>
    <div class="logo-area">
        <svg width="34" height="26" viewBox="0 0 38 28" fill="none">
            <path d="M4 13L19 3L34 13" stroke="#f97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M25 7.5V4H28V10" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 15V24C7 24.5523 7.44772 25 8 25H30C30.5523 25 31 24.5523 31 24V15" stroke="#0e7490" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        ROOMZY
    </div>

    <div class="top-search">
        <svg width="16" height="16" fill="none" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="globalSearch" placeholder="Search for PGs, Rooms, Hostels and Co-living" oninput="searchPG()">
    </div>

    <div class="header-right">
        <span class="city-selector">Jaipur 
            <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </span>
        <button class="sign-in-btn" onclick="showLogin()">Sign in</button>
        <div class="menu-icon" onclick="showOwner()">☰</div>
    </div>
</header>

<!-- Hero Section -->
<section class="hero" id="home">
    <div class="hero-content">
        <h1>Find Your Perfect<br>PG, Hassle Free</h1>
        <p class="hero-tags">Safe • Comfortable • Verified</p>
        <button class="explore-btn" onclick="document.getElementById('properties').scrollIntoView({behavior:'smooth'})">Explore PGs →</button>
    </div>
</section>

<!-- Floating Search Filter Bar -->
<div class="filter-bar-wrapper">
    <div class="filter-bar">
        <!-- Location Item -->
        <div class="filter-item">
            <div class="filter-icon-box">
                <svg width="20" height="20" fill="none" stroke="#0f172a" stroke-width="2" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <div class="filter-content">
                <input type="text" id="location" class="filter-main-val" value="Jaipur" placeholder="Jaipur" oninput="searchPG()">
                <span class="filter-sub-val">Change City</span>
            </div>
        </div>

        <!-- Check-in Date Item -->
        <div class="filter-item">
            <div class="filter-icon-box">
                <svg width="20" height="20" fill="none" stroke="#0f172a" stroke-width="2" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            </div>
            <div class="filter-content">
                <input type="date" id="checkInDate" class="filter-main-val" style="color: #64748b;">
                <span class="filter-sub-val">Check-in Date</span>
            </div>
        </div>

        <!-- Occupancy Item -->
        <div class="filter-item">
            <div class="filter-icon-box">
                <svg width="20" height="20" fill="none" stroke="#0f172a" stroke-width="2" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
            <div class="filter-content">
                <select id="occupancy" class="filter-main-val" onchange="searchPG()">
                    <option value="">Any Occupancy ▾</option>
                    <option value="Single">Single Sharing</option>
                    <option value="Double">Double Sharing</option>
                    <option value="Triple">Triple Sharing</option>
                </select>
                <span class="filter-sub-val">Select Occupancy</span>
            </div>
        </div>

        <!-- Search Action Button -->
        <div>
            <button class="search-action-btn" onclick="searchPG()">Search</button>
        </div>
    </div>
</div>

<!-- Category Tabs (Exact match to screenshot[cite: 13]) -->
<div class="categories-container">
    <div class="category-card active" onclick="filterCategory('', this)">
        <svg class="category-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <div class="category-title">All PGs</div>
    </div>
    <div class="category-card" onclick="filterCategory('Boys', this)">
        <svg class="category-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0Z"/></svg>
        <div class="category-title">Boys PG</div>
    </div>
    <div class="category-card" onclick="filterCategory('Girls', this)">
        <svg class="category-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#db2777" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0Z"/></svg>
        <div class="category-title">Girls PG</div>
    </div>
    <div class="category-card" onclick="filterCategory('Co-ed', this)">
        <svg class="category-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#9333ea" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <div class="category-title">Co-living</div>
    </div>
    <div class="category-card" onclick="filterOccupancy('Single', this)">
        <svg class="category-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg>
        <div class="category-title">Single Room</div>
    </div>
    <div class="category-card" onclick="filterOccupancy('Double', this)">
        <svg class="category-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2"><path d="M6 4v16"/><path d="M2 10h20"/><path d="M2 18h20"/><path d="M10 10v8"/></svg>
        <div class="category-title">Double Sharing</div>
    </div>
    <div class="category-card" onclick="filterLuxury(this)">
        <svg class="category-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#eab308" stroke-width="2"><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7z"/><path d="M5 20h14"/></svg>
        <div class="category-title">Luxury PG</div>
    </div>
</div>

<!-- Properties Section -->
<section class="properties-section" id="properties">
    <div class="section-header">
        <h2>Top Rated PGs in Jaipur</h2>
        <a href="#" class="view-all" onclick="resetFilters(); return false;">View All →</a>
    </div>

    <div class="property-container" id="propertyList"></div>
</section>

<!-- Bottom Navigation Bar -->
<div class="bottom-nav">
    <a href="#home" class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Home
    </a>
    <a href="#properties" class="nav-item">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        Explore
    </a>
    <a href="#properties" class="nav-item" onclick="showLogin()">
        <svg viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        My Bookings
    </a>
    <a href="#contact" class="nav-item" onclick="showOwner()">
        <svg viewBox="0 0 24 24"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        More
    </a>
</div>

<!-- Modal -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">×</span>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    const properties = [
        {
            id: 1,
            name: "The Study House",
            location: "Mansarovar",
            price: 6500,
            gender: "Boys",
            occupancy: "Double",
            rating: "4.6 (1.2k)",
            image: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=700",
            amenities: "Wi-Fi, Meals, Laundry"
        },
        {
            id: 2,
            name: "Bloom Girls Residence",
            location: "Malviya Nagar",
            price: 9200,
            gender: "Girls",
            occupancy: "Single",
            rating: "4.4 (856)",
            image: "https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=700",
            amenities: "Wi-Fi, AC, Laundry"
        },
        {
            id: 3,
            name: "Urban Nest Hostel",
            location: "Vaishali Nagar",
            price: 7800,
            gender: "Co-ed",
            occupancy: "Triple",
            rating: "4.5 (742)",
            image: "https://images.unsplash.com/photo-1555854877-bab0e564b8d5?w=700",
            amenities: "Wi-Fi, Meals, AC"
        },
        {
            id: 4,
            name: "Pink City Luxury Stay",
            location: "Raja Park",
            price: 13500,
            gender: "Girls",
            occupancy: "Single",
            rating: "4.3 (621)",
            image: "https://images.unsplash.com/photo-1590490360182-c33d57733427?w=700",
            amenities: "Wi-Fi, AC, Meals, Gym"
        },
        {
            id: 5,
            name: "Campus Corner PG",
            location: "Jagatpura",
            price: 5900,
            gender: "Boys",
            occupancy: "Triple",
            rating: "4.2 (410)",
            image: "https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=700",
            amenities: "Wi-Fi, Laundry"
        },
        {
            id: 6,
            name: "Olive Living Co-living",
            location: "Tonk Road",
            price: 14500,
            gender: "Co-ed",
            occupancy: "Single",
            rating: "4.8 (930)",
            image: "https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=700",
            amenities: "Wi-Fi, AC, Meals, Swimming Pool"
        }
    ];

    let savedProperties = [];
    try {
        savedProperties = JSON.parse(localStorage.getItem("roomzyProperties")) || [];
    } catch (e) {
        savedProperties = [];
    }

    let allProperties = [...savedProperties, ...properties];
    let currentOwner = null;

    function displayProperties(list) {
        const container = document.getElementById("propertyList");
        container.innerHTML = "";

        if (list.length === 0) {
            container.innerHTML = "<h3 style='grid-column: 1/-1; text-align:center; color:#64748b;'>No PGs found matching your criteria!</h3>";
            return;
        }

        list.forEach(property => {
            container.innerHTML += `
                <div class="property-card">
                    <div class="card-img-wrapper">
                        <img src="${property.image}" alt="PG Room">
                        <div class="rating-badge">★ ${property.rating || '4.5'}</div>
                    </div>
                    <div class="property-info">
                        <h3>${escapeText(property.name)}</h3>
                        <p>📍 ${escapeText(property.location)}, Jaipur</p>
                        <p>👤 ${escapeText(property.gender)} • ${escapeText(property.occupancy)}</p>
                        <div class="card-footer">
                            <div class="price">
                                ₹${Number(property.price).toLocaleString("en-IN")}<span>/mo</span>
                            </div>
                            <button class="details-btn" onclick="viewDetails(${property.id})">
                                View Details
                            </button>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    function escapeText(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&",
            "<": "<",
            ">": ">",
            '"': """,
            "'": "'"
        })[char]);
    }

    function searchPG() {
        const loc1 = document.getElementById("location").value.toLowerCase().trim();
        const loc2 = document.getElementById("globalSearch").value.toLowerCase().trim();
        const location = loc1 || loc2;

        const occupancy = document.getElementById("occupancy").value;

        const filtered = allProperties.filter(property => {
            const locationMatch = !location || property.location.toLowerCase().includes(location) || property.name.toLowerCase().includes(location);
            const occupancyMatch = !occupancy || property.occupancy === occupancy;
            return locationMatch && occupancyMatch;
        });

        displayProperties(filtered);
    }

    function filterCategory(genderVal, element) {
        document.querySelectorAll('.category-card').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        if (!genderVal) {
            displayProperties(allProperties);
            return;
        }

        const filtered = allProperties.filter(p => p.gender === genderVal);
        displayProperties(filtered);
    }

    function filterOccupancy(occVal, element) {
        document.querySelectorAll('.category-card').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        const filtered = allProperties.filter(p => p.occupancy === occVal);
        displayProperties(filtered);
    }

    function filterLuxury(element) {
        document.querySelectorAll('.category-card').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        const filtered = allProperties.filter(p => p.price >= 11000);
        displayProperties(filtered);
    }

    function resetFilters() {
        document.getElementById("location").value = "";
        document.getElementById("globalSearch").value = "";
        document.getElementById("occupancy").value = "";
        document.querySelectorAll('.category-card').forEach((el, idx) => {
            if(idx === 0) el.classList.add('active');
            else el.classList.remove('active');
        });
        displayProperties(allProperties);
    }

    function viewDetails(id) {
        const property = allProperties.find(p => p.id === id);
        if (!property) return;

        const modal = document.getElementById("modal");
        const body = document.getElementById("modalBody");

        body.innerHTML = `
            <h2>${escapeText(property.name)}</h2>
            <p>📍 ${escapeText(property.location)}, Jaipur</p>
            <p>Gender Preference: ${escapeText(property.gender)}</p>
            <p>Room Type: ${escapeText(property.occupancy)} Sharing</p>
            <p>Amenities: ${escapeText(property.amenities || 'Wi-Fi, Power Backup')}</p>
            <h3 style="color:#fb3f5c;margin:10px 0">
                ₹${Number(property.price).toLocaleString("en-IN")} / Month
            </h3>
            <button class="action-sub" onclick="showEnquiry(${property.id})">
                Contact Owner / Book Visit
            </button>
        `;
        modal.style.display = "flex";
    }

    function showEnquiry(id) {
        const property = allProperties.find(p => p.id === id);
        if (!property) return;

        document.getElementById("modalBody").innerHTML = `
            <h2>Send Enquiry</h2>
            <p style="font-size:12px; color:#64748b; margin-bottom:8px;">Property: ${escapeText(property.name)}</p>
            <form id="enquiryForm">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <input type="tel" placeholder="Phone Number" required>
                <button type="submit">Submit Enquiry</button>
            </form>
        `;

        document.getElementById("enquiryForm").addEventListener("submit", function(event) {
            event.preventDefault();
            alert("Demo enquiry submitted successfully! Owner will contact you shortly.");
            closeModal();
        });
    }

    function showLogin() {
        document.getElementById("modalBody").innerHTML = `
            <h2>Student Login</h2>
            <form id="loginForm">
                <input type="email" placeholder="Email Address" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        `;
        document.getElementById("modal").style.display = "flex";
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();
            alert("Demo student login successful!");
            closeModal();
        });
    }

    function showOwner() {
        document.getElementById("modalBody").innerHTML = `
            <h2>Property Owner Portal</h2>
            <form id="ownerForm">
                <input type="text" id="ownerName" placeholder="Owner Name" required>
                <input type="email" id="ownerEmail" placeholder="Email Address" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Owner Login / Register</button>
            </form>
        `;
        document.getElementById("modal").style.display = "flex";
        document.getElementById("ownerForm").addEventListener("submit", function(event) {
            event.preventDefault();
            currentOwner = {
                name: document.getElementById("ownerName").value,
                email: document.getElementById("ownerEmail").value
            };
            alert("Owner session active!");
            showOwnerDashboard();
        });
    }

    function showOwnerDashboard() {
        document.getElementById("modalBody").innerHTML = `
            <h2>Owner Dashboard</h2>
            <p>Welcome, ${escapeText(currentOwner.name)}</p>
            <button class="action-sub" style="margin-top:10px;" onclick="addPropertyModal()">+ Add New PG Listing</button>
        `;
    }

    function addPropertyModal() {
        document.getElementById("modalBody").innerHTML = `
            <h2>List Your PG</h2>
            <form id="propertyForm">
                <input type="text" id="pgName" placeholder="Property Name" required>
                <input type="text" id="pgLocation" placeholder="Area in Jaipur" required>
                <input type="number" id="pgPrice" placeholder="Monthly Rent (₹)" min="1000" required>
                <select id="pgGender">
                    <option value="Boys">Boys</option>
                    <option value="Girls">Girls</option>
                    <option value="Co-ed">Co-ed</option>
                </select>
                <select id="pgOccupancy">
                    <option value="Single">Single Sharing</option>
                    <option value="Double">Double Sharing</option>
                    <option value="Triple">Triple Sharing</option>
                </select>
                <input type="text" id="pgAmenities" placeholder="Amenities (Wi-Fi, AC, Meals)">
                <button type="submit">Publish Listing</button>
            </form>
        `;

        document.getElementById("propertyForm").addEventListener("submit", function(event) {
            event.preventDefault();
            const newProperty = {
                id: Date.now(),
                name: document.getElementById("pgName").value,
                location: document.getElementById("pgLocation").value,
                price: Number(document.getElementById("pgPrice").value),
                gender: document.getElementById("pgGender").value,
                occupancy: document.getElementById("pgOccupancy").value,
                amenities: document.getElementById("pgAmenities").value,
                rating: "New",
                image: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=700",
                owner: currentOwner.email
            };

            savedProperties.push(newProperty);
            localStorage.setItem("roomzyProperties", JSON.stringify(savedProperties));
            allProperties = [...savedProperties, ...properties];
            displayProperties(allProperties);
            alert("Property listed successfully!");
            closeModal();
        });
    }

    function closeModal() {
        document.getElementById("modal").style.display = "none";
    }

    // Initial load
    displayProperties(allProperties);
</script>

</body>
</html>
